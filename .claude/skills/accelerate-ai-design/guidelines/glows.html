<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-core);background:var(--white)}body{height:260px;display:grid;grid-template-columns:1fr 1fr;gap:0}.p{position:relative;overflow:hidden}.d{background:#0b1220}.l{background:#f7f9fc}.g{position:absolute;border-radius:50%;filter:blur(46px);pointer-events:none}.cap{position:absolute;left:18px;bottom:16px;font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase}.d .cap{color:#8a97b3}.l .cap{color:#8b98ab}</style></head><body><div class="p d"><div class="g" style="width:380px;height:274px;top:-120px;left:-110px;background:radial-gradient(closest-side,rgba(41,113,242,.5),rgba(41,113,242,0));transform:rotate(-18deg) scale(1,.82)"></div><div class="g" style="width:280px;height:202px;top:-90px;left:-70px;background:radial-gradient(closest-side,rgba(34,211,238,.2),rgba(34,211,238,0));transform:rotate(-18deg) scale(1,.82)"></div><div class="cap">Fondo oscuro · azul 50% + cian 20%</div></div><div class="p l"><div class="g" style="width:400px;height:288px;bottom:-130px;right:-120px;background:radial-gradient(closest-side,rgba(34,211,238,.16),rgba(34,211,238,0));transform:rotate(22deg) scale(1,.82)"></div><div class="cap">Fondo claro · UNA elipse, 12-18%, alternando azul/cian</div></div></body></html>
