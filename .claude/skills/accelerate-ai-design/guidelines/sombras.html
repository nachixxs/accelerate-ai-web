<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-core);background:var(--white)}body{height:200px;display:flex;align-items:center;gap:26px;padding:0 30px;background:#f7f9fc}.b{flex:1;height:110px;background:#fff;border-radius:22px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;font-size:10.5px;font-weight:600;color:#0f172a}.b span{color:#64748b;font-weight:500;margin-top:3px}.cta{flex:1;height:110px;border-radius:999px;background:#2971f2;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;box-shadow:0 18px 40px rgba(15,36,80,.45)}.cta span{opacity:.7;font-weight:500;margin-top:3px}</style></head><body><div class="b" style="box-shadow:0 24px 60px rgba(15,23,42,.14)">card<span>0 · 24 · 60 · #0f172a 14%</span></div><div class="b" style="box-shadow:0 16px 36px rgba(15,23,42,.16)">elevada<span>0 · 16 · 36 · #0f172a 16%</span></div><div class="cta">botón<span>0 · 18 · 40 · #0f2450 45%</span></div></body></html>
